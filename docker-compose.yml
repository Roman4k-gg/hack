name: ai-buddy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buddy}
      POSTGRES_DB: ${POSTGRES_DB:-buddy}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - buddy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buddy} -d ${POSTGRES_DB:-buddy}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - buddy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    logging: *default-logging

  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    image: ai-buddy/core:dev
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8081"
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://buddy:buddy@postgres:5432/buddy?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_TTL: ${JWT_TTL:-8h}
      AI_URL: ${AI_URL:-http://ai:8000}
      AI_CHAT_PATH: ${AI_CHAT_PATH:-/api/v1/chat/stream}
      CHAT_TIMEOUT: ${CHAT_TIMEOUT:-120s}
      MCP_URL: ${MCP_URL:-http://mcp:8001/mcp}
      CORE_URL: ${CORE_URL:-http://core:8081}
      INTEGRATIONS_MODE: ${INTEGRATIONS_MODE:-mock}
      FEATURE_FLAGS_OVERRIDE: ${FEATURE_FLAGS_OVERRIDE:-}
      MAX_TOOL_ITERATIONS: ${MAX_TOOL_ITERATIONS:-5}
      CONFIRMATION_TTL: ${CONFIRMATION_TTL:-300}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEED_DEMO: ${SEED_DEMO:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${CORE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - buddy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    image: ai-buddy/ai:dev
    profiles: ["dev", "demo"]
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://buddy:buddy@postgres:5432/buddy?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORE_URL: ${CORE_URL:-http://core:8081}
      MCP_URL: ${MCP_URL:-http://mcp:8001/mcp}
      LLM_MODE: ${LLM_MODE:-mock}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      MAX_TOOL_ITERATIONS: ${MAX_TOOL_ITERATIONS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${AI_PORT:-8000}:8000"
    depends_on:
      core:
        condition: service_healthy
    networks:
      - buddy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging: *default-logging

  mcp:
    build:
      context: ./ai
      dockerfile: Dockerfile
    image: ai-buddy/ai:dev
    profiles: ["mcp"]
    restart: unless-stopped
    command: ["python", "-m", "app.mcp"]
    environment:
      CORE_URL: ${CORE_URL:-http://core:8081}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${MCP_PORT:-8001}:8001"
    depends_on:
      core:
        condition: service_healthy
    networks:
      - buddy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8001/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging: *default-logging

  cron:
    image: ai-buddy/ai:dev
    profiles: ["cron"]
    restart: unless-stopped
    command: ["python", "-m", "app.cron"]
    environment:
      CORE_URL: ${CORE_URL:-http://core:8081}
      AI_URL: ${AI_URL:-http://ai:8000}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      core:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks:
      - buddy
    logging: *default-logging

  seed:
    image: ai-buddy/core:dev
    profiles: ["demo"]
    restart: "no"
    entrypoint: ["/usr/local/bin/seed"]
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://buddy:buddy@postgres:5432/buddy?sslmode=disable}
      SEED_DEMO: ${SEED_DEMO:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - buddy
    logging: *default-logging

  mocks:
    build:
      context: ./mocks
      dockerfile: Dockerfile
    image: ai-buddy/mocks:dev
    profiles: ["demo"]
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${MOCKS_PORT:-8090}:8090"
    networks:
      - buddy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ai-buddy/web:dev
    profiles: ["dev", "demo"]
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      core:
        condition: service_healthy
    networks:
      - buddy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - buddy
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - buddy
    logging: *default-logging

  langfuse:
    image: langfuse/langfuse:2
    profiles: ["llm-tracing"]
    restart: unless-stopped
    environment:
      LANGFUSE_USE_EXTERNAL_POSTGRES: "true"
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-buddy}
      DATABASE_USERNAME: ${POSTGRES_USER:-buddy}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-buddy}
      LANGFUSE_INIT_DATABASE_URL: postgres://${POSTGRES_USER:-buddy}:${POSTGRES_PASSWORD:-buddy}@postgres:5432/${POSTGRES_DB:-buddy}
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3002}
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET:-dev-secret-change-me}
      SALT: ${LANGFUSE_SALT:-dev-secret-change-me}
      TELEMETRY_ENABLED: "false"
    ports:
      - "${LANGFUSE_PORT:-3002}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - langfuse:/var/lib/postgresql/data
    networks:
      - buddy
    logging: *default-logging

networks:
  buddy:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  langfuse:

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: ai-buddy

scrape_configs:
  - job_name: core
    metrics_path: /metrics
    static_configs:
      - targets: ["core:8081"]

  - job_name: ai
    metrics_path: /metrics
    static_configs:
      - targets: ["ai:8000"]

  - job_name: mcp
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp:8001"]

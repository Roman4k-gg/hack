name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.23'

jobs:
  go:
    name: Go · core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Нужно отформатировать:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: core/coverage.out
          if-no-files-found: error

  go-integration:
    name: Go · core с PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: buddy
          POSTGRES_PASSWORD: buddy
          POSTGRES_DB: buddy
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U buddy -d buddy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: core
    env:
      POSTGRES_TEST_DSN: postgres://buddy:buddy@localhost:5432/buddy?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Test with database
        run: go test ./... -race

  docker:
    name: Docker · сборка образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build core image
        run: docker compose build core

  python:
    name: Python · ai
    if: ${{ hashFiles('ai/pyproject.toml') != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

  web:
    name: Web
    if: ${{ hashFiles('web/package.json') != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  smoke:
    name: Smoke · стенд целиком
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start core stack
        run: docker compose up --build -d --wait

      - name: Seed demo data
        run: docker compose --profile demo run --rm seed

      - name: Start web
        run: docker compose --profile dev up -d --wait web

      - name: Smoke checks
        run: bash scripts/smoke.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=100
